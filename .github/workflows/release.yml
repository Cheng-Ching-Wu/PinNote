# Builds the Windows installers and attaches them to a draft GitHub Release.
#
# Triggers:
# - Push to develop (the release branch): releases automatically when the version
#   in tauri.conf.json has no tag yet (bump the version → push develop → done).
#   Otherwise skipped. After publishing, merge develop into main, which only
#   holds released versions.
# - Push a tag, e.g. `git tag v0.2.0 && git push origin v0.2.0` (must match the version).
# - Manual run from the Actions tab.
name: Release

on:
  push:
    branches:
      - develop
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Never build the same ref twice at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: decide
        env:
          TAG: v${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the app version ($TAG) in tauri.conf.json"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          # A draft release has no git tag until it is published, so check releases too.
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null \
            || gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists (tag or draft release) — bump the version to release again."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Test
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      # WiX / NSIS that the bundler would download from GitHub Releases, which
      # often answers HTTP 504. Fetched here with retries and cached right away
      # (even if the build fails later), so the bundler finds them in place.
      - name: Restore bundler tools
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-bundler-tools-${{ runner.os }}-v1

      - name: Download bundler tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          function Get-WithRetry([string]$Url, [string]$OutFile) {
            for ($i = 1; $i -le 6; $i++) {
              try {
                Invoke-WebRequest -Uri $Url -OutFile $OutFile -UseBasicParsing
                return
              } catch {
                Write-Host "Attempt $i failed for ${Url}: $_"
                Start-Sleep -Seconds (15 * $i)
              }
            }
            throw "Could not download $Url"
          }

          # Same versions / layout the Tauri bundler uses (%LOCALAPPDATA%\tauri).
          $tools = Join-Path $env:LOCALAPPDATA 'tauri'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $tmp = $env:RUNNER_TEMP

          Get-WithRetry 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' "$tmp\wix.zip"
          Expand-Archive "$tmp\wix.zip" -DestinationPath "$tools\WixTools314" -Force

          Get-WithRetry 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip' "$tmp\nsis.zip"
          Expand-Archive "$tmp\nsis.zip" -DestinationPath $tmp -Force
          Move-Item "$tmp\nsis-3.11" "$tools\NSIS"

          $plugins = "$tools\NSIS\Plugins\x86-unicode"
          New-Item -ItemType Directory -Force "$plugins\additional" | Out-Null
          Get-WithRetry 'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll' "$plugins\additional\nsis_tauri_utils.dll"
          Copy-Item "$plugins\additional\nsis_tauri_utils.dll" $plugins

      - name: Save bundler tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-bundler-tools-${{ runner.os }}-v1

      # Creates the tag on this commit when it doesn't exist yet (main / manual runs).
      - name: Build and upload to release
        id: build
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; the app checks them against `plugins.updater.pubkey`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.check.outputs.version }}
          releaseName: PinNote v${{ needs.check.outputs.version }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: 安裝檔見下方 Assets。目前尚未數位簽章，首次執行若出現 SmartScreen 警告請點「其他資訊」→「仍要執行」。
          # Also attach latest.json for the in-app updater.
          includeUpdaterJson: true
          releaseDraft: true
          prerelease: false

      - name: Wait before retrying
        if: steps.build.outcome == 'failure'
        run: Start-Sleep -Seconds 30

      # One more try for passing network errors; same settings as above.
      # Compiled code is reused, so this only redoes bundling and upload.
      - name: Build and upload to release (retry)
        if: steps.build.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; the app checks them against `plugins.updater.pubkey`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.check.outputs.version }}
          releaseName: PinNote v${{ needs.check.outputs.version }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: 安裝檔見下方 Assets。目前尚未數位簽章，首次執行若出現 SmartScreen 警告請點「其他資訊」→「仍要執行」。
          # Also attach latest.json for the in-app updater.
          includeUpdaterJson: true
          releaseDraft: true
          prerelease: false
